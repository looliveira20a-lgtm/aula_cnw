                desc: "Fatia de torta gelada com creme leve de baunilha, cobertura de ganache de chocolate e biscoito calipso.",
                img: "https://images.unsplash.com/photo-1535141192574-5d4897c13136?auto=format&fit=crop&w=600&q=80"
            },

                name: "Milkshake de Morango Natural",
                category: "sobremesas",
                badge: "Refrescante",
                price: 18.50,
                desc: "Milkshake super cremoso preparado com sorvete de baunilha e calda artesanal de morangos frescos.",
                img: "https://images.unsplash.com/photo-1579954115545-a95591f28bfc?auto=format&fit=crop&w=600&q=80"
            }
        ];

        // Estado do Carrinho
        let cart = [];

        // Elementos DOM
        const menuGrid = document.getElementById('menu-grid');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const openCartBtn = document.getElementById('open-cart-btn');
        const closeCartBtn = document.getElementById('close-cart-btn');
        const cartDrawer = document.getElementById('cart-drawer');
        const cartOverlay = document.getElementById('cart-overlay');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        const cartCount = document.getElementById('cart-count');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const navLinks = document.getElementById('nav-links');
        const contactForm = document.getElementById('contact-form');
        const checkoutBtn = document.getElementById('checkout-btn');

        // Imagens alternativas por categoria, para evitar que bebidas e sobremesas
        // apareçam com uma foto de hambúrguer caso alguma imagem falhe.
        const fallbackImages = {
            artesanais: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80",
            tradicionais: "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=600&q=80",
            porcoes: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=80",
            bebidas: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80",
            sobremesas: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=600&q=80"
        };

        // Renderizar Produtos do Cardápio
        function renderProducts(category = 'todos') {
            menuGrid.innerHTML = '';

            const filteredProducts = category === 'todos'
                ? menuProducts
                : menuProducts.filter(p => p.category === category);

            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'food-card';

                card.innerHTML = `
                    <div class="food-img-box">
                        <img
                            src="${product.img}"
                            alt="${product.name}"
                            class="food-img"
                            data-fallback="${fallbackImages[product.category]}"
                            onerror="if (!this.dataset.fallbackUsed) { this.dataset.fallbackUsed = '1'; this.src = this.dataset.fallback; } else { this.style.display = 'none'; }"
                        >
                        ${product.badge ? `<span class="food-badge">${product.badge}</span>` : ''}
                    </div>
                    <div class="food-info">
                        <h3 class="food-title">${product.name}</h3>
                        <p class="food-desc">${product.desc}</p>
                        <div class="food-bottom">
                            <span class="food-price">R$ ${product.price.toFixed(2).replace('.', ',')}</span>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;

                menuGrid.appendChild(card);
            });
        }

        // Adicionar ao Carrinho
        function addToCart(productId) {
            const product = menuProducts.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
